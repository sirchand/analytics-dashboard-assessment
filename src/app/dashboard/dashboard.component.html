<div class="dashboard-container">
  <h1>Electric Vehicle Population Dashboard</h1>

  <!-- Filter Section -->
  <div class="filter-section">
    <mat-form-field appearance="outline">
      <mat-label>Search</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Search vehicles" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Filter by Make</mat-label>
      <mat-select [(value)]="selectedMake" (selectionChange)="filterData()">
        <mat-option value="">All</mat-option>
        <mat-option *ngFor="let make of uniqueMakes" [value]="make">
          {{ make }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Charts Section -->
  <div class="charts-section">
    <!-- Bar Chart -->
    <div class="chart">
      <h2>Vehicle Counts by Make</h2>
      <canvas
        baseChart
        [datasets]="chartData"
        [labels]="chartLabels"
        [options]="chartOptions"
        [legend]="true"
        [type]="'bar'"
      ></canvas>
    </div>

    <!-- Pie Chart -->
    <div class="chart">
      <h2 >Proportion of Vehicles by Make</h2>
      <canvas
        baseChart
        [datasets]="pieChartData"
        [labels]="pieChartLabels"
        [options]="pieChartOptions"
        [legend]="true"
        [type]="'pie'"
      ></canvas>
    </div>
  </div>

  <!-- Table Section -->
  <div class="table-section">
    <h2>Vehicle Details</h2>
    <table mat-table [dataSource]="filteredData" class="mat-elevation-z8">
      <!-- Make Column -->
      <ng-container matColumnDef="Make">
        <th mat-header-cell *matHeaderCellDef> Make </th>
        <td mat-cell *matCellDef="let element"> {{ element.Make }} </td>
      </ng-container>

      <!-- Model Column -->
      <ng-container matColumnDef="Model">
        <th mat-header-cell *matHeaderCellDef> Model </th>
        <td mat-cell *matCellDef="let element"> {{ element.Model }} </td>
      </ng-container>

      <!-- Year Column -->
      <ng-container matColumnDef="Year">
        <th mat-header-cell *matHeaderCellDef> Year </th>
        <td mat-cell *matCellDef="let element"> {{ element['Model Year'] }} </td>
      </ng-container>

      <!-- Electric Range Column -->
      <ng-container matColumnDef="Electric Range">
        <th mat-header-cell *matHeaderCellDef> Electric Range </th>
        <td mat-cell *matCellDef="let element"> {{ element['Electric Range'] }} </td>
      </ng-container>

      <!-- Header and Row Definitions -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
</div>
